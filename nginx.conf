server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Strict policy: the game uses no inline code and no third-party origins.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Serve the files; anything else is a 404. (Avoid add_header inside
  # location blocks: it would drop the security headers above.)
  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(?:js|css|svg)$ {
    expires 1h;
    try_files $uri =404;
  }
}
